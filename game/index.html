<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Skyline Courier — Fly the valley, thread the rings</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a1222;
    color: #f2f0e6;
    font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
  #help {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(242, 240, 230, 0.55);
    background: rgba(10, 18, 34, 0.45);
    padding: 4px 12px;
    border-radius: 999px;
    pointer-events: none;
    white-space: nowrap;
  }
  noscript p {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyline Courier flight game"></canvas>
<div id="help">↑ ↓ climb &amp; descend · ← → bank &amp; turn · W / S throttle · drag to steer · P pause · M sound</div>
<noscript><p>Skyline Courier needs JavaScript to fly.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
